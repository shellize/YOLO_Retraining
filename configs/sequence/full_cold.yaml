sequence:
  name: null
  label: full-cold
  seed: 42
  output_root: ../../runs/sequences
arrivals:
  - {id: stage0}
  - {id: stage1}
  - {id: stage2}
  - {id: stage3}
  - {id: stage4}
  - {id: stage5}
  - {id: stage6}
  - {id: stage7}
data:
  layout: ../data/self_improving.yaml
  validation: [val]
  # Append test_difficult here when the excluded hard subset also needs a separate score.
  test: [test, test_filtered]
scope_rule: {candidate: all_seen}
initialization:
  first: {source: pretrained, checkpoint: yolov5s.pt}
  subsequent: {source: pretrained, checkpoint: yolov5s.pt}
task_template:
  model: {backend: yolov5, definition: yolov5s.yaml}
  select_policy: {name: full, params: {}}
  epoch_policy: {name: static, params: {}}
  budget: {type: epochs, value: 100}
  backend:
    params: {batch: 64, imgsz: 640, device: 0, workers: 16, amp: true}
  evaluation: {primary_metric: map30, test_scope: seen, evaluate_checkpoints: [last, best]}
task_overrides: {}
