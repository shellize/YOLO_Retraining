sequence:
  name: null
  label: full-cold
  seed: 42
  output_root: ../../runs/sequences
arrivals:
  - {id: stage0, data: ../data/example.yaml}
scope_rule: {candidate: all_seen, evaluation: seen}
initialization:
  first: {source: pretrained, checkpoint: yolov5s.pt}
  subsequent: {source: pretrained, checkpoint: yolov5s.pt}
task_template:
  model: {backend: yolov5, definition: yolov5s.yaml}
  select_policy: {name: full, params: {}}
  epoch_policy: {name: static, params: {}}
  budget: {type: epochs, value: 100}
  backend:
    params: {batch: 32, imgsz: 640, device: [0, 1], workers: 8, amp: true}
  evaluation: {primary_metric: map50_95, test_scope: seen, evaluate_checkpoints: [last, best]}
task_overrides: {}
