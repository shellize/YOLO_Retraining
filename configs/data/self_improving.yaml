# Frozen group-aware 8:1:1 protocol published from Study 0910.
# Every logical group is constrained by an explicit UTF-8 TXT manifest.
path: ../../data/self_improving
names:
  0: large luggage
  1: stroller
  2: wheelchair
  3: flatbed truck
groups:
  val:
    split: val
    manifest: ../../configs/data/manifests/self_improving/val.txt
