# Logical experiment groups mapped onto the physical 0720 batch folders.
# Change only this file when regrouping batches; no image movement is required.
path: ../../data/self_improving
names:
  0: large luggage
  1: stroller
  2: wheelchair
  3: flatbed truck
groups:
  test:
    split: test
    images: [images/0720_1, images/0720_2]
  val:
    split: val
    images: [images/0720_3, images/0720_4]
  stage0:
    split: train
    # Larger base-training set: 4496 trainable images across 9 batches.
    images:
      - images/0720_5
      - images/0720_6
      - images/0720_7
      - images/0720_8
      - images/0720_9
      - images/0720_10
      - images/0720_11
      - images/0720_12
      - images/0720_13
  stage1:
    split: train
    # Increment 1: 1000 trainable images across 2 batches.
    images: [images/0720_14, images/0720_15]
  stage2:
    split: train
    # Increment 2: 1000 trainable images across 2 batches.
    images: [images/0720_16, images/0720_17]
  stage3:
    split: train
    # Increment 3: 1075 trainable images across 3 batches.
    images: [images/0720_18, images/0720_19, images/0720_20]
