# Logical experiment groups mapped onto the physical 0720 batch folders.
# Change only this file when regrouping batches; no image movement is required.
path: ../../data/self_improving
names:
  0: large luggage
  1: stroller
  2: wheelchair
  3: flatbed truck
groups:
  test:
    split: test
    images: [images/0720_1, images/0720_2]
  val:
    split: val
    images: [images/0720_3, images/0720_4]
  stage0:
    split: train
    # Larger base-training set: 2996 trainable images.
    images:
      - images/0720_5
      - images/0720_6
      - images/0720_7
      - images/0720_8
      - images/0720_9
      - images/0720_10
  stage1:
    split: train
    # Increment 1: 1500 images.
    images: [images/0720_11, images/0720_12, images/0720_13]
  stage2:
    split: train
    # Increment 2: 1500 images.
    images: [images/0720_14, images/0720_15, images/0720_16]
  stage3:
    split: train
    # Increment 3: 1575 images.
    images: [images/0720_17, images/0720_18, images/0720_19, images/0720_20]
