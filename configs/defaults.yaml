task:
  name: null
  label: experiment
  seed: 42
  output_root: ../runs/tasks
  parent_result: null

select_policy:
  name: full
  params: {}

epoch_policy:
  name: static
  params: {}

budget:
  type: epochs
  value: 100

backend:
  params:
    batch: 64
    imgsz: 640
    device: 0
    workers: 16
    amp: true
    # Criterion used to save best.pt: map50 or yolov5_fitness.
    best_metric: map50

evaluation:
  primary_metric: map50_95
  test_scope: seen
  evaluate_checkpoints: [last, best]
