<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>8.26 组会报告｜测试集划分与泛化</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-soft: #f7f7f4;
      --plot: #f1f3f2;
      --text: #1d2732;
      --muted: #5d6975;
      --grid: #d7dbdc;
      --border: #d2d6d8;
      --white: #ffffff;
      --black: #111827;
      --red: #c78170;
      --red-border: #9b604e;
      --blue: #9db3c1;
      --blue-border: #6f8999;
      --warning: #85562d;
      --ideal: #35684a;
      --shadow: 0 4px 16px rgba(35, 40, 45, .07);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      font-size: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .page {
      width: 100%;
      max-width: none;
      min-height: 100vh;
      margin: 0;
      padding: 14px clamp(12px, 2.5vw, 36px) 12px;
      background: var(--surface);
      border: 0;
      box-shadow: none;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #245f8f;
      font-size: 17px;
      font-weight: 800;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      max-width: 1000px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: clamp(2rem, 4vw, 3.35rem);
      letter-spacing: -.03em;
      line-height: 1.24;
    }

    .lead {
      max-width: 930px;
      margin-bottom: 32px;
      color: var(--muted);
      font-size: 1.15rem;
      line-height: 1.65;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 22px;
      align-items: center;
      margin-bottom: 34px;
      padding: 14px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: .86rem;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .legend-mark {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .legend-mark.sample {
      border: 1px solid var(--black);
      background: var(--white);
    }

    .legend-mark.train { background: var(--red); border: 1px solid var(--red-border); }
    .legend-mark.test { background: var(--blue); border: 1px solid var(--blue-border); }

    .legend-mark.risk {
      width: 24px;
      height: 0;
      border-top: 2px dashed var(--warning);
      border-radius: 0;
    }

    .scheme-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 8px 12px;
      margin: 4px 0 0;
      padding: 0;
      color: rgba(93, 105, 117, .62);
      font-size: .72rem;
    }

    .scheme-tools button {
      padding: 2px 5px;
      border: 0;
      background: transparent;
      color: rgba(93, 105, 117, .72);
      font: inherit;
      font-size: .72rem;
      cursor: pointer;
    }

    .scheme-tools button:hover { color: var(--muted); }
    .scheme-tools button:focus-visible { outline: 2px solid var(--blue-border); outline-offset: 2px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .diagrams {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px 12px;
      align-items: start;
    }

    figure {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .figure-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .figure-heading h2 {
      margin-bottom: 4px;
      color: var(--text);
      font-size: clamp(1.05rem, 1.7vw, 1.55rem);
      line-height: 1.25;
    }

    .figure-kicker {
      margin: 0;
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.45;
    }

    .figure-badge {
      display: none;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      overflow: visible;
    }

    .figure-title {
      display: block;
      max-width: none;
      margin: 2px 0 0;
      padding: 0;
      border: 0;
      color: var(--text);
      font-size: .82rem;
      font-weight: 500;
      line-height: 1.35;
      text-align: center;
    }

    .plot-bg { fill: var(--plot); stroke: var(--border); stroke-width: 1.2; }
    .grid-line { stroke: var(--grid); stroke-width: 1; opacity: 0; }
    .axis-line { stroke: var(--black); stroke-width: 1.1; opacity: .35; }
    .axis-text { fill: var(--muted); font-size: 12px; }
    .batch-cloud { fill: none; stroke: #8e9aa2; stroke-width: 1.8; stroke-dasharray: 5 5; opacity: .86; }
    .batch-cloud.train-cloud { fill: var(--red); fill-opacity: .08; stroke: var(--red-border); }
    .batch-cloud.test-cloud { fill: var(--blue); fill-opacity: .1; stroke: var(--blue-border); }
    .batch-cloud.mixed-cloud { fill: #aeb8bd; fill-opacity: .04; }
    .batch-number { fill: #52606d; font-size: 10px; text-anchor: middle; }
    .true-point { fill: var(--white); stroke: var(--black); stroke-width: 1.5; cursor: pointer; }
    .true-point:focus { outline: none; stroke-width: 2.5; }
    .train-point { fill: var(--red); stroke: var(--red-border); }
    .test-point { fill: var(--blue); stroke: var(--blue-border); }
    .temporal-link { stroke: var(--warning); stroke-width: 1.7; stroke-dasharray: 5 4; opacity: .9; }
    .risk-label { fill: var(--warning); font-size: 11px; font-weight: 600; }
    .plot-note { fill: var(--text); font-size: 12px; font-weight: 600; }
    .ideal-label { fill: var(--ideal); font-size: 11px; font-weight: 600; }

    .equation {
      max-width: none;
      margin: 8px 0 0;
      color: #245f8f;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.15rem, 2.6vw, 1.8rem);
      font-weight: 700;
      line-height: 1.25;
    }

    .equation sub { font-size: .55em; }
    .equation.warning { color: var(--warning); }
    .equation.ideal { color: #245f8f; }
    .equation.existing { color: var(--red-border); }

    figcaption {
      display: grid;
      gap: 7px;
      max-width: none;
      margin: 10px 0 0;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: .72rem;
      line-height: 1.45;
    }

    figcaption strong { color: var(--text); }

    .takeaway {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 38px;
      padding-top: 30px;
      border-top: 2px solid var(--text);
    }

    .takeaway-block {
      padding: 18px 20px;
      border-left: 4px solid #245f8f;
      background: var(--surface-soft);
    }

    .takeaway-block.warning { border-left-color: var(--warning); }

    .takeaway-block h2 {
      margin-bottom: 6px;
      font-size: 1rem;
    }

    .takeaway-block p {
      margin-bottom: 0;
      color: var(--muted);
      font-size: .92rem;
    }

    footer {
      margin-top: 28px;
      color: rgba(159, 178, 199, .72);
      font-size: .8rem;
    }

    @media (max-width: 980px) {
      .page { width: 100%; margin: 0; padding: 14px 12px 16px; border: 0; box-shadow: none; }
    }

    @media (max-width: 760px) {
      .diagrams, .takeaway { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="diagrams" aria-label="已有数据分布与三种训练集和测试集采样方式对比">
      <figure>
        <svg id="ideal-split" viewBox="0 0 760 440" role="img" aria-labelledby="ideal-title ideal-desc">
          <title id="ideal-title">理想情况下训练集和测试集分布的二维示意图</title>
          <desc id="ideal-desc">红色训练点和蓝色测试点从同一真实分布中重新选择，均匀散布在整个二维空间，训练集和测试集具有相近的空间分布，并且没有画出相邻视频帧跨越两个集合的警示线。</desc>
        </svg>
        <figcaption class="figure-title">理想采样</figcaption>
      </figure>

      <figure>
        <svg id="existing-split" viewBox="0 0 760 440" role="img" aria-labelledby="existing-title existing-desc">
          <title id="existing-title">已有数据分布的二维示意图</title>
          <desc id="existing-desc">方式一和方式二中所有已经被选入数据集的样本统一显示为红色，白色样本表示真实分布中尚未采集到或未纳入已有数据集的位置。</desc>
        </svg>
        <figcaption class="figure-title">已有数据分布</figcaption>
      </figure>

      <figure>
        <svg id="batch-split" viewBox="0 0 760 440" role="img" aria-labelledby="batch-title batch-desc">
          <title id="batch-title">按 batch 整体划分的二维示意图</title>
          <desc id="batch-desc">白色黑边圆表示真实分布中的样本。六个 batch 簇中的样本变成红色训练集，另外两个完整 batch 变成蓝色测试集，因此训练集和测试集占据不同区域。</desc>
        </svg>
        <figcaption class="figure-title">方式一：按 batch 整体划分</figcaption>
      </figure>

      <figure>
        <svg id="random-split" viewBox="0 0 760 440" role="img" aria-labelledby="random-title random-desc">
          <title id="random-title">全量随机抽样的二维示意图</title>
          <desc id="random-desc">红色训练点和蓝色测试点在各个 batch 内混合分布。黄色虚线标出相邻视频帧可能被分别放入训练集和测试集，从而产生信息泄露风险。</desc>
        </svg>
        <figcaption class="figure-title">方式二：全量随机抽样</figcaption>
      </figure>
    </section>

    <div class="scheme-tools" aria-label="保存颜色方案">
      <span id="scheme-status" class="sr-only" role="status" aria-live="polite">点击圆圈编辑颜色，保存后作为永久配置</span>
      <button id="save-color-scheme" type="button">保存颜色方案</button>
    </div>
  </main>

  <script>
    (() => {
      const NS = "http://www.w3.org/2000/svg";
      const colorStates = ["white", "red", "blue"];
      const colorNames = { white: "白色", red: "红色", blue: "蓝色" };
      const colorSchemeStorageKey = "yolo-retraining-8.26-circle-colors-v1";
      const schemeStatus = document.getElementById("scheme-status");
      const canUseLocalStorage = typeof localStorage !== "undefined";
      let savedColorScheme = {};
      if (canUseLocalStorage) {
        try {
          const parsed = JSON.parse(localStorage.getItem(colorSchemeStorageKey) || "{}");
          if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) savedColorScheme = parsed;
        } catch (_) {
          savedColorScheme = {};
        }
      }

      const saveColorScheme = (message = "已自动保存当前颜色方案") => {
        if (!canUseLocalStorage) {
          if (schemeStatus) schemeStatus.textContent = "当前浏览器不支持本地保存";
          return;
        }
        try {
          localStorage.setItem(colorSchemeStorageKey, JSON.stringify(savedColorScheme));
          if (schemeStatus) schemeStatus.textContent = message;
        } catch (_) {
          if (schemeStatus) schemeStatus.textContent = "颜色方案保存失败，请检查浏览器存储权限";
        }
      };

      const saveButton = document.getElementById("save-color-scheme");
      if (saveButton) saveButton.addEventListener("click", () => saveColorScheme("已保存当前颜色方案"));
      if (schemeStatus && Object.keys(savedColorScheme).length) {
        schemeStatus.textContent = `已恢复 ${Object.keys(savedColorScheme).length} 个圆圈的颜色`;
      }
      const plot = { left: 52, top: 48, right: 720, bottom: 414 };
      const pointRadius = 13;
      const minimumDistance = pointRadius * 2 + 2;
      const batchSpecs = [
        { center: [108, 86], offsets: [[7, -22], [38, -9], [-22, 8], [9, 12], [33, 33], [-15, 38]] },
        { center: [278, 92], offsets: [[28, -29], [-14, -22], [8, 0], [-22, 11], [31, 19], [-40, 34], [-9, 36]] },
        { center: [468, 105], offsets: [[-40, -36], [-7, -25], [24, -14], [11, 13], [-22, 15], [35, 40]] },
        { center: [630, 145], offsets: [[-8, -39], [-39, -36], [25, -33], [-3, -11], [-37, -4], [36, 0], [-22, 22], [18, 28]] },
        { center: [145, 252], offsets: [[-36, -38], [-6, -27], [28, -18], [-30, -8], [26, 12], [-22, 29], [10, 37]] },
        { center: [350, 228], offsets: [[0, -38], [-42, -37], [38, -36], [-21, -13], [28, -5], [41, 26], [12, 30], [-21, 36]] },
        { center: [528, 276], offsets: [[-21, -36], [38, -22], [1, -2], [-29, 22], [3, 35], [33, 36]] },
        { center: [650, 346], offsets: [[41, -39], [-21, -29], [8, -25], [-26, 1], [28, 2], [41, 31], [-3, 38]] }
      ];

      let seed = 82611;
      const random = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      };

      const batchPoints = [];
      batchSpecs.forEach(({ center: [cx, cy], offsets }, batch) => {
        const accepted = [];
        offsets.forEach(([dx, dy]) => {
          const candidate = {
            id: `batch-${batch}-${accepted.length}`,
            batch,
            localIndex: accepted.length,
            x: cx + dx,
            y: cy + dy
          };
          const isSeparated = [...batchPoints, ...accepted].every((point) => Math.hypot(point.x - candidate.x, point.y - candidate.y) >= minimumDistance);
          if (isSeparated) accepted.push(candidate);
        });
        batchPoints.push(...accepted);
      });

      const backgroundPoints = [];
      let attempts = 0;
      while (backgroundPoints.length < 70 && attempts < 150000) {
        const candidate = {
          id: `background-${backgroundPoints.length}`,
          batch: null,
          localIndex: null,
          x: plot.left + 18 + random() * (plot.right - plot.left - 36),
          y: plot.top + 18 + random() * (plot.bottom - plot.top - 36)
        };
        const existingPoints = [...batchPoints, ...backgroundPoints];
        const isSeparated = existingPoints.every((point) => Math.hypot(point.x - candidate.x, point.y - candidate.y) >= minimumDistance);
        if (isSeparated) backgroundPoints.push(candidate);
        attempts += 1;
      }

      const clusterRadius = 48;
      backgroundPoints.forEach((point) => {
        const cluster = batchSpecs.findIndex(({ center: [cx, cy] }) =>
          Math.hypot(point.x - cx, point.y - cy) <= clusterRadius
        );
        if (cluster >= 0) point.batch = cluster;
      });

      const points = [...backgroundPoints, ...batchPoints];
      const wholeTestBatches = new Set([2, 6]);
      const batchPointsForSplit = points.filter((point) => point.batch !== null);
      const randomTestIds = new Set([
        ...batchPointsForSplit
          .filter((point) => point.localIndex === 1 || point.localIndex === 4)
          .map((point) => point.id)
      ]);
      const randomTrainIds = new Set([
        ...batchPointsForSplit.filter((point) => !randomTestIds.has(point.id)).map((point) => point.id)
      ]);
      const idealTestIds = new Set();
      const idealTrainIds = new Set();
      const idealCells = new Map();
      const idealColumns = 4;
      const idealRows = 3;
      const idealPool = points;
      idealPool.forEach((point) => {
        const column = Math.min(idealColumns - 1, Math.floor((point.x - plot.left) / (plot.right - plot.left) * idealColumns));
        const row = Math.min(idealRows - 1, Math.floor((point.y - plot.top) / (plot.bottom - plot.top) * idealRows));
        const key = `${column}-${row}`;
        if (!idealCells.has(key)) idealCells.set(key, []);
        idealCells.get(key).push(point);
      });
      idealCells.forEach((cellPoints) => {
        cellPoints.sort((a, b) => a.y - b.y || a.x - b.x);
        if (cellPoints[0]) idealTestIds.add(cellPoints[0].id);
        cellPoints.slice(1, 4).forEach((point) => idealTrainIds.add(point.id));
      });

      const element = (tag, attrs = {}, text = "") => {
        const node = document.createElementNS(NS, tag);
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
        if (text) node.textContent = text;
        return node;
      };

      const pointById = (id) => points.find((point) => point.id === id);

      function drawAxes(svg) {
        svg.appendChild(element("rect", { class: "plot-bg", x: plot.left, y: plot.top, width: plot.right - plot.left, height: plot.bottom - plot.top, rx: 0 }));
        [110, 220, 330, 440, 550, 660].forEach((x) => svg.appendChild(element("line", { class: "grid-line", x1: x, y1: plot.top, x2: x, y2: plot.bottom })));
        [104, 160, 216, 272, 328, 384].forEach((y) => svg.appendChild(element("line", { class: "grid-line", x1: plot.left, y1: y, x2: plot.right, y2: y })));
        svg.appendChild(element("line", { class: "axis-line", x1: plot.left, y1: plot.bottom, x2: plot.right, y2: plot.bottom }));
        svg.appendChild(element("line", { class: "axis-line", x1: plot.left, y1: plot.top, x2: plot.left, y2: plot.bottom }));
      }

      function drawBatchClouds(svg, mode) {
        if (mode === "ideal") return;
        batchSpecs.forEach((_, batch) => {
          const clusterPoints = points.filter((point) => point.batch === batch);
          if (!clusterPoints.length) return;
          const xs = clusterPoints.map((point) => point.x);
          const ys = clusterPoints.map((point) => point.y);
          const minX = Math.min(...xs);
          const maxX = Math.max(...xs);
          const minY = Math.min(...ys);
          const maxY = Math.max(...ys);
          const cloudClass = mode === "batch"
            ? `batch-cloud ${wholeTestBatches.has(batch) ? "test-cloud" : "train-cloud"}`
            : mode === "existing"
              ? "batch-cloud train-cloud"
              : "batch-cloud mixed-cloud";
          svg.appendChild(element("ellipse", {
            class: cloudClass,
            cx: (minX + maxX) / 2,
            cy: (minY + maxY) / 2,
            rx: Math.max(34, (maxX - minX) / 2 + 14),
            ry: Math.max(32, (maxY - minY) / 2 + 14)
          }));
        });
      }

      function drawPoints(svg, mode) {
        points.forEach((point) => {
          const isTest = mode === "existing"
            ? false
            : mode === "batch"
              ? point.batch !== null && wholeTestBatches.has(point.batch)
              : mode === "ideal"
                ? idealTestIds.has(point.id)
                : randomTestIds.has(point.id);
          const isTrain = mode === "existing"
            ? point.batch !== null
            : mode === "batch"
              ? point.batch !== null && !wholeTestBatches.has(point.batch)
              : mode === "ideal"
                ? idealTrainIds.has(point.id)
                : randomTrainIds.has(point.id);
          const defaultState = isTest ? "blue" : isTrain ? "red" : "white";
          const stateKey = `${mode}:${point.id}`;
          const initialState = colorStates.includes(savedColorScheme[stateKey])
            ? savedColorScheme[stateKey]
            : defaultState;
          const classForState = (state) => state === "red" ? "true-point train-point" : state === "blue" ? "true-point test-point" : "true-point";
          const circle = element("circle", {
            class: classForState(initialState),
            cx: point.x,
            cy: point.y,
            r: pointRadius,
            "data-point-id": point.id,
            "data-color-state": initialState,
            role: "button",
            tabindex: "0",
            "aria-label": `点击切换样本点颜色，当前为${colorNames[initialState]}`
          });
          const advanceColor = () => {
            const currentState = circle.getAttribute("data-color-state") || "white";
            const nextState = colorStates[(colorStates.indexOf(currentState) + 1) % colorStates.length];
            circle.setAttribute("data-color-state", nextState);
            circle.setAttribute("class", classForState(nextState));
            circle.setAttribute("aria-label", `点击切换样本点颜色，当前为${colorNames[nextState]}`);
            savedColorScheme[stateKey] = nextState;
            if (schemeStatus) schemeStatus.textContent = "颜色已修改，点击“保存当前颜色方案”后永久保留";
          };
          circle.addEventListener("click", advanceColor);
          circle.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              advanceColor();
            }
          });
          svg.appendChild(circle);
        });
      }

      function drawRiskLinks(svg) {
        [0, 2, 4, 6].forEach((batch) => {
          const a = pointById(`batch-${batch}-0`);
          const b = pointById(`batch-${batch}-1`);
          svg.appendChild(element("line", { class: "temporal-link", x1: a.x, y1: a.y, x2: b.x, y2: b.y }));
        });
      }

      function draw(id, mode) {
        const svg = document.getElementById(id);
        drawAxes(svg);
        drawBatchClouds(svg, mode);
        if (mode === "random") drawRiskLinks(svg);
        drawPoints(svg, mode);
      }

      draw("ideal-split", "ideal");
      draw("existing-split", "existing");
      draw("batch-split", "batch");
      draw("random-split", "random");
    })();
  </script>
</body>
</html>
