[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-retraining"
version = "0.1.0"
description = "Research-oriented baseline retraining experiments with original YOLOv5s."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "MIT"}
dependencies = [
  "GitPython>=3.1,<4",
  "ipython>=8.18,<9",
  "numpy>=1.26,<2",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "matplotlib>=3.8,<4",
  "opencv-python>=4.9,<5",
  "pandas>=2.1,<3",
  "psutil>=5.9,<8",
  "requests>=2.31,<3",
  "scipy>=1.11,<2",
  "seaborn>=0.13,<1",
  "setuptools>=70,<81",
  "tensorboard>=2.15,<3",
  "thop>=0.1.1",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
]
analysis = [
  "onnx==1.22.0",
  "onnxruntime==1.23.2",
]
ultralytics = ["ultralytics==8.4.102"]

[project.scripts]
yolo-retraining = "yolo_retraining.run:main"
yolo-retraining-doctor = "yolo_retraining.doctor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "smoke: downloads weights and runs a tiny real detector cycle",
  "ddp: requires at least two CUDA devices",
]
